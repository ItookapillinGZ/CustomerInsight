services:
  customerinsight:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      APP_USAGE_DB_PATH: /data/product_usage.sqlite3
      APP_DATA_DIR: /data/customerinsight
      APP_PUBLIC_MODE: "${APP_PUBLIC_MODE:-false}"
    volumes:
      - usage_data:/data
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  usage_data:
